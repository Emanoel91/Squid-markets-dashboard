# Save as: .github/workflows/record_daily_snapshot.yml
# Records Squid (QUID) 24h volumes at the end of every UTC day and commits the CSV to the repo.
name: Record Squid daily snapshot

on:
  schedule:
    - cron: "55 23 * * *"   # every day at 23:55 UTC
  workflow_dispatch: {}      # allows running it manually from the Actions tab

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - name: Record snapshot
        run: python collect_daily_snapshot.py --out data/squid_daily_history.csv

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/squid_daily_history.csv
          git commit -m "Record daily snapshot" || echo "No changes to commit"
          git push
